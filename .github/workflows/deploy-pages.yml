name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/yaycommerce-website-redesign-3tycns]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /platfourm2

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      # Publishing to the gh-pages branch auto-enables GitHub Pages for the
      # repo; the workflow token cannot enable the newer artifact-based Pages
      # deployment on a repo where Pages has never been turned on.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
