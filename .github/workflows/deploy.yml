name: Deploy v5 to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The v5 site is served at https://tommyclaude.github.io/platfourm2/v5/
      # destination_dir only syncs the v5/ subfolder of the gh-pages branch,
      # so the sites at the branch root, /v3 and /v4 stay untouched.
      # All asset paths in the site are relative, so no base-path config is
      # needed.
      - name: Publish to gh-pages under /v5
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          destination_dir: v5
          exclude_assets: '.github'
