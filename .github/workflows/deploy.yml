name: Deploy v3 to GitHub Pages (platfourm3)

on:
  push:
    branches:
      - v3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-v3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PLATFOURM3_TOKEN: ${{ secrets.PLATFOURM3_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The v3 site is served at https://tommyclaude.github.io/platfourm3 —
      # that URL belongs to a separate `platfourm3` repository, so this
      # repo's own gh-pages branch (which serves /platfourm2) is never
      # touched. Cross-repo publishing needs a classic PAT with `repo`
      # scope saved as the PLATFOURM3_TOKEN secret; without it the deploy
      # is skipped so pushes to v3 stay green.
      - name: Publish to TommyClaude/platfourm3 gh-pages
        if: env.PLATFOURM3_TOKEN != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PLATFOURM3_TOKEN }}
          external_repository: TommyClaude/platfourm3
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
          exclude_assets: '.github'

      - name: Deploy skipped
        if: env.PLATFOURM3_TOKEN == ''
        run: echo "PLATFOURM3_TOKEN secret not set — deploy skipped. See README for setup."
