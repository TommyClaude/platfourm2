name: Deploy v3 to GitHub Pages

on:
  push:
    branches:
      - v3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The v3 site is served at https://tommyclaude.github.io/platfourm2/v3/
      # destination_dir only syncs the v3/ subfolder of the gh-pages branch,
      # so the current site at the branch root (/platfourm2) stays untouched.
      # All asset paths in the site are relative, so no base-path config is
      # needed.
      - name: Publish to gh-pages under /v3
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          destination_dir: v3
          exclude_assets: '.github'
